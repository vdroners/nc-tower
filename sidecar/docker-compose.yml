# Generic NC Tower sidecar — no lab paths or IPs.
# Copy sidecar/.env.example → .env and set mounts / allowlists for your host.
#
# Lab (GCS) overlay: docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d
# Or use docker-compose.lab.yml alone on the operator estate.

services:
  nc-tower-sidecar:
    build: .
    image: ${NC_TOWER_SIDECAR_IMAGE:-nc-tower-sidecar:local}
    container_name: nc_tower_sidecar
    restart: unless-stopped
    working_dir: /app
    privileged: true
    pid: host
    env_file:
      - .env
    environment:
      NC_TOWER_BIND: "0.0.0.0"
      NC_TOWER_PORT: "18765"
      NC_TOWER_OPS_ROOT: ${NC_TOWER_OPS_ROOT:-/ops}
      NC_TOWER_HOST_PROC: ${NC_TOWER_HOST_PROC:-/hostproc}
      NC_TOWER_FAN_HELPER: ${NC_TOWER_FAN_HELPER:-/usr/local/bin/gpu-fan-helper.py}
      NC_TOWER_NVIDIA_SMI: ${NC_TOWER_NVIDIA_SMI:-/usr/bin/nvidia-smi}
      NC_TOWER_SMARTCTL: ${NC_TOWER_SMARTCTL:-/usr/sbin/smartctl}
      NC_TOWER_DOCKER: ${NC_TOWER_DOCKER:-/usr/bin/docker}
      NC_TOWER_BACKUP_SCRIPT: ${NC_TOWER_BACKUP_SCRIPT:-/ops/bin/backup.sh}
      NC_TOWER_AUDIT_LOG: ${NC_TOWER_AUDIT_LOG:-/var/log/nc-tower-sidecar/audit.log}
      NC_TOWER_DISK_PATHS: ${NC_TOWER_DISK_PATHS:-/}
      NC_TOWER_COMPOSE_DIRS: ${NC_TOWER_COMPOSE_DIRS:-}
      NC_TOWER_SERVICE_TARGETS: ${NC_TOWER_SERVICE_TARGETS:-}
      NC_TOWER_HOST_JOBS_DIR: ${NC_TOWER_HOST_JOBS_DIR:-/ops/jobs}
      NC_TOWER_CONTAINER_ALLOW: ${NC_TOWER_CONTAINER_ALLOW:-}
      NC_TOWER_CONTAINER_LOG_ALLOW: ${NC_TOWER_CONTAINER_LOG_ALLOW:-}
      NC_TOWER_CONTAINER_DENY: ${NC_TOWER_CONTAINER_DENY:-nc_tower_sidecar}
      NC_TOWER_SYSTEMD_ALLOW: ${NC_TOWER_SYSTEMD_ALLOW:-docker.service,ssh.service}
      NC_TOWER_IMAGE_PULL_ALLOW: ${NC_TOWER_IMAGE_PULL_ALLOW:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ${NC_TOWER_OPS_HOST_PATH:-./ops}:/ops
      - /dev:/dev
      - /sys:/sys:ro
      - /proc:/hostproc:ro
      - /run:/run
      - /etc/os-release:/host/etc/os-release:ro
      - nc_tower_sidecar_audit:/var/log/nc-tower-sidecar
    ports:
      - "${NC_TOWER_PUBLISH:-127.0.0.1:18765:18765}"
    networks:
      - ${NC_TOWER_NETWORK:-default}

volumes:
  nc_tower_sidecar_audit:

networks:
  default:
    name: ${NC_TOWER_NETWORK_NAME:-nc_tower_sidecar_net}
