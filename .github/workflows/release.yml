name: Release

on:
  release:
    types: [published]

jobs:
  appstore:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build
        run: npm ci

      - name: Resolve version from info.xml
        id: ver
        run: |
          VERSION=$(grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' appinfo/info.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag '${TAG}' must equal info.xml version '${VERSION}' (no 'v' prefix)."
            exit 1
          fi

      - name: Build App Store tarball
        run: make appstore

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: nc_tower-${{ steps.ver.outputs.version }}
          path: /tmp/nc_tower-${{ steps.ver.outputs.version }}.tar.gz

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "/tmp/nc_tower-${{ steps.ver.outputs.version }}.tar.gz" \
            --clobber
